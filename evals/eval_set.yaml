    expect_source: mitre-atlas-overview.md

  # secure-rag-design.md
  - question: "How should retrieved content be treated to mitigate prompt injection in RAG?"
    expect_source: secure-rag-design.md
  - question: "When should a RAG system refuse to answer?"
    expect_source: secure-rag-design.md
  - question: "Why is continuous retrieval evaluation important for RAG security?"
