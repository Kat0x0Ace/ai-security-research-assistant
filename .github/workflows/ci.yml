name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (chunking, cache, refusal, streaming, escaping, injection guards)
        run: pytest -q

      - name: Retrieval eval (fails below 80% hit-rate)
        run: python evals/run_eval.py --reingest
