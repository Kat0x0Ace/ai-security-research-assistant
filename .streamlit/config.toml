# "Analyst's dossier" theme. Fonts are served from ./static/fonts so the app
# makes no requests to Google Fonts (keeps the "nothing leaves this machine" promise).

[server]
enableStaticServing = true
# Listen on this computer only. Without this, Streamlit accepts connections on
# every network interface, so anyone on the same Wi-Fi could query your documents.
# (Docker overrides this on the command line; compose then publishes to 127.0.0.1 only.)
address = "127.0.0.1"

[client]
# Uncaught errors show a short message, not a stack trace with local file paths.
# Full details still print in the terminal.
showErrorDetails = "none"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#d9a441"
backgroundColor = "#0c0e12"
secondaryBackgroundColor = "#12151b"
textColor = "#ebe6dc"
borderColor = "#252a35"
linkColor = "#d9a441"
baseRadius = "10px"
font = "IBM Plex Sans"
headingFont = "Fraunces"
codeFont = "IBM Plex Mono"

[theme.sidebar]
backgroundColor = "#12151b"
secondaryBackgroundColor = "#181c24"

[[theme.fontFaces]]
family = "Fraunces"
url = "app/static/fonts/Fraunces-var.woff2"
weight = "500 600"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-400.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-500.woff2"
weight = 500

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-600.woff2"
weight = 600

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-400.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-500.woff2"
weight = 500
